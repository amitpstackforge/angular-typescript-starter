<div class="flex items-end gap-3 mb-4">
  <div class="flex-1">
    <label class="text-xs text-slate-600">Search</label>
    <input
      class="w-full border rounded px-3 py-2"
      [(ngModel)]="q"
      (ngModelChange)="onSearchChange()"
      placeholder="Restaurant name..."
    />
  </div>

  <div>
    <label class="text-xs text-slate-600">City</label>
    <select
      class="border rounded px-3 py-2"
      [(ngModel)]="city"
      (change)="load()"
    >
      <option value="">All</option>

      <option *ngFor="let city of cities" [value]="city">
        {{ city }}
      </option>
    </select>
  </div>

  <div>
    <label class="text-xs text-slate-600">Sort</label>
    <select class="border rounded px-3 py-2" [(ngModel)]="sort">
      <option value="rating">Rating</option>
      <option value="time">Delivery time</option>
    </select>
  </div>

  <button class="bg-black text-white rounded px-4 py-2" (click)="load()">
    Search
  </button>
</div>

<!-- Skeleton Loading -->
<div *ngIf="loading()" class="grid md:grid-cols-2 gap-4">
  <div
    *ngFor="let s of [1, 2]"
    class="bg-white border rounded-xl overflow-hidden animate-pulse"
  >
    <div class="w-full h-40 bg-gray-200"></div>

    <div class="p-4 space-y-3">
      <div class="h-4 bg-gray-200 rounded w-3/4"></div>
      <div class="h-3 bg-gray-200 rounded w-1/2"></div>
      <div class="h-3 bg-gray-200 rounded w-1/3"></div>
    </div>
  </div>
</div>

<div *ngIf="error()" class="text-center py-10 text-red-500">
  <p class="text-lg font-semibold">
    {{ error() }}
  </p>

  <button class="mt-3 px-4 py-2 bg-black text-white rounded" (click)="load()">
    Retry
  </button>
</div>

<!-- Empty State -->
<div
  *ngIf="!loading() && !error() && restaurants().length == 0"
  class="flex items-center justify-center py-16"
>
  <div
    class="bg-white shadow-md rounded-2xl p-8 text-center max-w-md w-full border"
  >
    <div class="text-5xl mb-4">🍽️</div>

    <p class="text-xl font-semibold text-gray-800 mb-2">No restaurants found</p>

    <p class="text-gray-500 text-sm">Try changing the city or search keyword</p>
  </div>
</div>

<div class="grid md:grid-cols-2 gap-4">
  <a
    *ngFor="let r of restaurants(); trackBy: trackByRestaurantId"
    class="bg-white border rounded-xl overflow-hidden hover:shadow"
    [routerLink]="['/restaurants', r.id]"
  >
    <img class="w-full h-40 object-cover" [src]="r.imageUrl || fallback" />
    <div class="p-4">
      <div class="font-semibold">{{ r.name }}</div>
      <div class="text-sm text-slate-600">
        {{ r.city }} • {{ r.cuisineType }}
      </div>
      <div class="mt-2 text-sm">
        ⭐ {{ r.ratingAvg.toFixed(1) }} • {{ r.deliveryTimeMin }} min
      </div>
    </div>
  </a>
</div>

<div class="flex justify-center items-center gap-4 mt-6">
  <button
    (click)="prev()"
    class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition disabled:opacity-50"
  >
    Previous
  </button>

  <span class="px-4 py-2 bg-white border rounded-lg text-sm font-medium">
    Page: {{ page() }}
  </span>

  <button
    (click)="next()"
    [disabled]="page() >= totalPages - 1"
    class="px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800 transition"
  >
    Next
  </button>
</div>
