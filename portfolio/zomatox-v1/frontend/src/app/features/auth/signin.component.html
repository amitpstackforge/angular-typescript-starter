<section class="mx-auto max-w-md">
  <h1 class="mb-2 text-2xl font-bold">Welcome back</h1>
  <p class="mb-6 text-sm text-slate-600">
    Sign in to continue ordering and tracking deliveries.
  </p>

  <form
    [formGroup]="signInForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4 rounded-xl border bg-white p-5 shadow-sm"
    novalidate
  >
    <div>
      <label for="email" class="mb-1 block text-sm font-medium">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="w-full rounded border px-3 py-2"
        placeholder="you@example.com"
      />
      <p
        *ngIf="f.email.touched && f.email.errors?.['required']"
        class="mt-1 text-xs text-red-600"
      >
        Email is required.
      </p>
      <p
        *ngIf="f.email.touched && f.email.errors?.['email']"
        class="mt-1 text-xs text-red-600"
      >
        Enter a valid email address.
      </p>
      <p *ngIf="backendErrorFor('email')" class="mt-1 text-xs text-red-600">
        {{ backendErrorFor("email") }}
      </p>
    </div>

    <div>
      <label for="password" class="mb-1 block text-sm font-medium"
        >Password</label
      >
      <input
        id="password"
        type="password"
        formControlName="password"
        class="w-full rounded border px-3 py-2"
        placeholder="Enter your password"
      />
      <p
        *ngIf="f.password.touched && f.password.errors?.['required']"
        class="mt-1 text-xs text-red-600"
      >
        Password is required.
      </p>
      <p *ngIf="backendErrorFor('password')" class="mt-1 text-xs text-red-600">
        {{ backendErrorFor("password") }}
      </p>
    </div>

    <div
      *ngIf="generalError"
      class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
    >
      {{ generalError }}
    </div>

    <button
      type="submit"
      [disabled]="isLoading()"
      class="w-full rounded bg-black px-4 py-2 text-white disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ isLoading() ? "Signing in..." : "Sign in" }}
    </button>

    <a
      routerLink="/signup"
      class="block text-center text-sm text-slate-600 hover:underline"
    >
      Create an account
    </a>
  </form>
</section>
